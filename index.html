<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Houssam YAKHLAF · GNOME Terminal Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="terminal-window">
    <div class="window-header">
      <div class="window-buttons">
        <div class="win-btn win-btn-close"></div>
        <div class="win-btn win-btn-min"></div>
        <div class="win-btn win-btn-max"></div>
      </div>
      <div class="window-title">houssam@HoussamYK: ~/portfolio</div>
    </div>
    <div class="terminal-body">
      <div class="terminal-output" id="termOutputArea"></div>
      <div class="terminal-input-line">
        <span class="prompt-gnome">
          <span class="prompt-user-gnome">[houssam</span><span class="prompt-at-gnome">@</span><span
            class="prompt-host-gnome">HoussamYK</span><span class="prompt-path-gnome"> ~</span><span
            class="prompt-dollar-gnome">]$</span>
        </span>
        <input type="text" class="gnome-input" id="gnomeTermInput" autofocus autocomplete="off" spellcheck="false"
          aria-label="GNOME terminal input" placeholder="">
      </div>
    </div>
  </div>

  <!-- Hidden anchor to trigger download of existing HYK_CV.pdf -->
  <a id="cvDownloadLink" style="display: none;" download="HYK_CV.pdf"></a>
  <script src="script.js"></script>
</body>

</html>
